[package]
name = "sql-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }  # hooks: query timeout
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
# Leiden is implemented in src/tree.rs (no crate), so runs are reproducible from tree::SEED.
